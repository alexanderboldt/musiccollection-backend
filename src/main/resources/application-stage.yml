quarkus:
  http:
    cors:
      enabled: true
      origins: /.*/
      methods: GET,PUT,POST,DELETE
  devservices:
    enabled: false
  datasource:
    db-kind: postgresql
    jdbc:
      url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    migrate-at-start: true
  oidc:
    auth-server-url: ${KC_URL}
    application-type: service
    token:
      issuer: any
      principal-claim: sub
  s3:
    endpoint-override: ${S3_URL}
    path-style-access: true
    aws:
      region: eu-central-1
      credentials:
        type: static
        static-provider:
          access-key-id: ${S3_ACCESS_KEY}
          secret-access-key: ${S3_SECRET_KEY}

bucket:
  artist: ${BUCKET_ARTIST}
  album: ${BUCKET_ALBUM}
