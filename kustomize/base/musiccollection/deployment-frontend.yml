apiVersion: v1
kind: Service
metadata:
  name: musiccollection-frontend
spec:
  type: NodePort
  selector:
    app: musiccollection-frontend
  ports:
    - port: 4200 # internal cluster port
      targetPort: 4200
      nodePort: 30100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musiccollection-frontend
spec:
  selector:
    matchLabels:
      app: musiccollection-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: musiccollection-frontend
    spec:
      containers:
        - name: musiccollection-frontend
          image: ghcr.io/alexanderboldt/musiccollection-frontend:0.3.1-staging
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
