services:
  musiccollection-postgres:
    image: postgres:17.4
    container_name: musiccollection-postgres
    env_file: kustomize/base/secrets/postgres.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - musiccollection

  musiccollection-postgres-keycloak:
    image: postgres:17.4
    container_name: musiccollection-postgres-keycloak
    env_file: kustomize/base/secrets/postgres-keycloak.env
    ports:
      - 5433:5432
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - musiccollection

  musiccollection-keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: musiccollection-keycloak
    command: start-dev --import-realm
    env_file: kustomize/base/secrets/keycloak.env
    ports:
      - 8080:8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      - musiccollection-postgres-keycloak
    networks:
      - musiccollection

  musiccollection-rustfs:
    image: rustfs/rustfs:latest
    container_name: musiccollection-rustfs
    env_file: kustomize/base/secrets/rustfs.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - rustfs_data:/data
    networks:
      - musiccollection

  musiccollection-backend:
    image: ghcr.io/alexanderboldt/musiccollection-backend:10.2.0-stage
    container_name: musiccollection-backend
    env_file:
      - kustomize/base/secrets/postgres.env
      - kustomize/base/secrets/musiccollection.env
    ports:
      - 4000:4000
    depends_on:
      - musiccollection-postgres
      - musiccollection-keycloak
      - musiccollection-rustfs
    networks:
      - musiccollection

volumes:
  postgres_data:
  postgres_keycloak_data:
  rustfs_data:

networks:
  musiccollection:
    name: musiccollection
